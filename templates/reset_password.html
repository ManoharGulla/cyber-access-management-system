<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>

<style>

body{
background:#06192d;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{

background:#123456;
padding:40px;
border-radius:15px;
width:450px;
box-shadow:0 0 20px #00aaff;

}

input{

width:100%;
padding:12px;
margin-top:15px;
margin-bottom:20px;
border-radius:8px;
border:none;

}

button{

width:100%;
padding:12px;
background:#ff9800;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#e68900;

}

</style>

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<br>

<p>User:</p>

<b>{{ user }}</b>

<form method="POST">

<input
type="password"
name="password"
placeholder="Enter New Password"
required>

<button type="submit">

Update Password

</button>

</form>

</div>

</body>

</html>
